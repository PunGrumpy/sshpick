# NEW STAGING (STG-ORG, built 2026)

# bastion: jump host for the stg network
Host new-bastion
  HostName 192.0.2.20
# consul server 1
  # indented comment wins (the last comment above Host)
Host new-consul1 consul1.stg
  ProxyJump new-bastion
Host new-consul2
  ProxyJump new-bastion
Host new-consul? new-consul1 new-*
  User ubuntu
Host *.corp jumpbox
  User ops
