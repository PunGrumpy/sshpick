name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changesets:
    name: Changesets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # With changesets pending, this opens or updates the release pull request and stops.
      # Merging that pull request leaves none, and the jobs below publish its version.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version-packages
          commit-message: "chore: Release sshpick"
          pr-title: "chore: Release sshpick"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  check-version:
    name: Check version
    needs: changesets
    if: needs.changesets.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          set -eu
          version="$(jq -r .version crates/sshpick/package.json)"
          echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "crates/sshpick/package.json: version ${version} is not X.Y.Z" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" > /dev/null 2>&1; then
            echo "v${version} is already released"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build (${{ matrix.target }})
    needs: check-version
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.check-version.outputs.needed == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -eu
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          name="sshpick-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/sshpick" "target/${{ matrix.target }}/release/sp" LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          rm -r "dist/${name}"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check-version, build]
    if: ${{ !cancelled() && needs.check-version.outputs.needed == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check Cargo.toml matches package.json
        run: |
          set -eu
          cargo="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          test "${cargo}" = "${VERSION}" || { echo "package.json says ${VERSION} but Cargo.toml says ${cargo}; run bun scripts/sync-version.ts" >&2; exit 1; }
      - name: Release notes from the changelog
        run: |
          set -eu
          awk -v v="$VERSION" '/^## /{h=$2; gsub(/[][]/, "", h); f=(h==v); next} /^\[[^]]+\]: /{next} f' crates/sshpick/CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "crates/sshpick/CHANGELOG.md has no section for ${VERSION}" >&2; exit 1; }
      # The release creates the tag on this commit. A tag pushed with GITHUB_TOKEN starts no
      # workflow run, so a tag cannot trigger the release the way a hand-pushed tag used to.
      - run: gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "sshpick v${VERSION}" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
