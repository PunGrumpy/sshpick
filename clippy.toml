disallowed-types = [
  { path = "std::collections::hash_map::DefaultHasher", reason = "its output changes across Rust releases; name a hasher" },
]
disallowed-methods = [
  { path = "std::collections::VecDeque::new", reason = "allocates; use with_capacity" },
  { path = "ratatui::init", reason = "panics on terminal errors; the picker's terminal is sshpick-ui's Tty" },
  { path = "ratatui::init::init_with_options", reason = "panics on terminal errors; the picker's terminal is sshpick-ui's Tty" },
  { path = "ratatui::init::run", reason = "panics on terminal errors; the picker's terminal is sshpick-ui's Tty" },
  { path = "ratatui::init::restore", reason = "swallows the error; sshpick-ui's Tty restores the terminal" },
  { path = "ratatui::try_init", reason = "takes the alternate screen; the picker is a block drawn by sshpick-ui's Tty" },
  { path = "ratatui::try_init_with_options", reason = "an inline viewport asks the terminal where the cursor is and waits up to 2 s; use Viewport::Fixed with sshpick-ui's Inline backend" },
  { path = "crossterm::cursor::position", reason = "asks the terminal where the cursor is and waits up to 2 s for the answer" },
  { path = "crossterm::terminal::supports_keyboard_enhancement", reason = "asks the terminal and waits for the answer" },
  { path = "ratatui::Terminal::get_cursor_position", reason = "asks the backend where the cursor is; the inline backend only knows the block's own rows" },
]

allow-expect-in-tests = true
allow-unwrap-in-tests = true
